# Generated by agent-team init. Commit this file; keep API keys and tokens in .env.
#
# Template profile: "slim". The slim profile is the external-consumer starter; full adds the self-dogfood topology.
# PM provider: "github".
# Required provider keys now:
# - github.owner: GitHub repository owner or organization. Required only when pm.provider is github.
# - github.repo: GitHub repository name. Required only when pm.provider is github.
# Provider sections for modes you are not using can stay blank.
# Optional runtime, health, notification, label, and project fields can stay at defaults until needed.
# After editing provider settings, run: agent-team doctor --commands
#
# GitHub Projects v2 board: https://github.com/users/nickw444/projects/1
# Dispatch gesture: move an issue into Status = "Ready for Agent", then run
# `.agent_team/scripts/github-intake-poll.sh` (until a webhook/intake server
# can reach this host). The pipeline matches ticket.status_changed with that
# exact status string. The `ready-for-agent` label is a backup ingest path.
# Project API calls need `gh auth refresh -s read:project -s project`.

