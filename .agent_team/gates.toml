# Machine-readable gate tiers for hass-conx.
#
# Smoke is CI on the worker PR when workflows exist. With no workflows yet,
# the CI gate records an explicit no-op pass so the pipeline can proceed.
# Acceptance and release still require their own evidence.

schema_version = 1

[tiers.smoke]
description = "CI / mechanical checks that should pass before adversarial review."
evidence_required = false

[tiers.acceptance]
description = "Full conformance gates that prove the change satisfies the project contract."
evidence_required = true

[tiers.release]
description = "Release-readiness gates that prove all release evidence is present."
evidence_required = true

[claims.smoke]
description = "Smoke confidence only. This does not claim acceptance or release readiness."
required_tiers = ["smoke"]

[claims.acceptance]
description = "Full conformance claim. Requires smoke plus acceptance evidence."
required_tiers = ["smoke", "acceptance"]

[claims.release]
description = "Release-readiness claim. Requires smoke, acceptance, and release evidence."
required_tiers = ["smoke", "acceptance", "release"]
missing_evidence = "fail"

[[gates]]
id = "ci-pr-checks"
tier = "smoke"
description = "GitHub Actions checks on the worker PR are green (no-op pass when no workflows exist)."
command = "./.agent_team/scripts/ci-pr-checks.sh"
required_for = ["smoke", "acceptance", "release"]

[[gates]]
id = "acceptance-evidence"
tier = "acceptance"
description = "Project-specific conformance or integration evidence exists."
evidence_required = true
evidence_hint = "target/agent-evidence/<job>.acceptance.json, CI conformance run URL, or equivalent machine-readable artifact."
required_for = ["acceptance", "release"]

[[gates]]
id = "visual-qa"
tier = "acceptance"
description = "GUI screenshot evidence exists for a vision-capable reviewer to judge visual correctness."
evidence_required = true
optional = true
evidence_hint = "target/agent-evidence/gates/<job>/visual-qa/manifest.json plus captured screenshot PNG files from the visual-qa skill."
required_for = ["acceptance", "release"]

[[gates]]
id = "release-artifact-evidence"
tier = "release"
description = "Release build, publish, and asset verification evidence exists."
evidence_required = true
evidence_hint = "Release workflow run URL plus artifact manifest, checksum log, or downloadable asset verification."
required_for = ["release"]
